<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AWAKENED BY YAH</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; background:#050814; color:white; font-family:sans-serif; }

/* TOP BANNER */
.top-header-banner{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:180px;
  background:#000;
  z-index:1000;
}
.top-header-banner img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* PUSH CONTENT DOWN */
.page{
  padding-top:180px;
}

/* HERO */
.hero{
  display:flex;
  justify-content:space-between;
  padding:40px;
}
.release{
  max-width:300px;
}
</style>
</head>

<body>

<!-- BANNER -->
<div class="top-header-banner">
  <img src="/images/awakened-by-yah-banner.png">
</div>

<div class="page">

<div class="hero">

<div>
<h1>AWAKENED BY YAH</h1>
<p>Truth Based Music</p>
</div>

<div class="release">

<img src="/images/transformation-aby.jpg" style="width:100%; border-radius:10px;">

<p id="trackTitle">Better Man</p>

<audio id="player" controls style="width:100%;">
<source src="/audio/the-transformation/better-man.mp3">
</audio>

<br><br>

<button onclick="playTrack(0)">Better Man</button>
<button onclick="playTrack(1)">Remix</button>

</div>

</div>

<ul id="playlist">
<li data-src="/audio/the-transformation/better-man.mp3">Better Man</li>
<li data-src="/audio/the-transformation/better-man-remix.mp3">Better Man Remix</li>
</ul>

</div>

<script>
function playTrack(i){
const tracks = [
{src:"/audio/the-transformation/better-man.mp3", title:"Better Man"},
{src:"/audio/the-transformation/better-man-remix.mp3", title:"Better Man Remix"}
];

document.getElementById("player").src = tracks[i].src;
document.getElementById("trackTitle").innerText = tracks[i].title;
document.getElementById("player").play();
}
</script>

</body>
</html>
