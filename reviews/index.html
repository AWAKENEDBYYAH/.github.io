<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="canonical" href="https://awakenedbyyahmusic.com/reviews/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" type="image/png" href="/images/aby-official-logo.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.png">

  <title>Listener Ratings — AWAKENED BY YAH</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; }

    body{
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #182544 0%, #050814 55%, #020308 100%);
      color: #f9fafb;
      line-height:1.6;
      -webkit-font-smoothing: antialiased;
    }

    a{ color:inherit; text-decoration:none; }

    :root{
      --gold:#fbbf24;
      --card: radial-gradient(circle at top left, #111827 0%, #020617 70%);
      --stroke: rgba(148,163,184,0.35);
    }

    .page{ min-height:100vh; display:flex; flex-direction:column; }
    .shell{ width:100%; max-width:1100px; margin:0 auto; padding:2.25rem 1.5rem 3rem; }

    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:1rem;
      margin-bottom:1.25rem;
      flex-wrap:wrap;
    }

    .brand{ display:flex; align-items:center; gap:.8rem; }
    .brand img{
      width:58px;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.7));
    }
    .brand .t1{
      font-weight:800;
      letter-spacing:.22em;
      text-transform:uppercase;
      color: var(--gold);
      font-size:.95rem;
      display:block;
    }
    .brand .t2{
      font-size:.70rem;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:#cbd5e1;
      opacity:.9;
      display:block;
    }

    .navpills{ display:flex; gap:.5rem; flex-wrap:wrap; }

    .pill{
      font-size:0.72rem;
      padding:0.25rem 0.85rem;
      border-radius:999px;
      border:1px solid rgba(148,163,184,0.45);
      text-transform:uppercase;
      letter-spacing:0.16em;
      background: rgba(15,23,42,0.9);
      backdrop-filter: blur(10px);
      transition: all .15s ease;
      white-space:nowrap;
    }
    .pill:hover{
      background: rgba(148,163,184,0.22);
      border-color: rgba(248,250,252,0.6);
      transform: translateY(-1px);
    }
    .pill.gold{
      border-color: rgba(251,191,36,0.7);
      color: var(--gold);
    }
    .pill.gold:hover{
      background: rgba(251,191,36,0.12);
      border-color: rgba(251,191,36,1);
    }

    .card{
      background: var(--card);
      border-radius:24px;
      padding:1.7rem 1.5rem;
      box-shadow:0 18px 40px rgba(0,0,0,0.7);
      border:1px solid var(--stroke);
    }

    .kicker{
      font-size:0.76rem;
      letter-spacing:0.24em;
      text-transform:uppercase;
      color:#9ca3af;
      margin-bottom:.25rem;
    }

    h1{
      font-family:'Cinzel', serif;
      font-weight:700;
      letter-spacing:.22em;
      text-transform:uppercase;
      font-size:1.45rem;
      margin-bottom:.35rem;
    }

    .sub{
      color:#e5e7eb;
      max-width:48rem;
      font-size:0.95rem;
    }

    .ctaRow{
      margin-top:1.2rem;
      display:flex; gap:.75rem; flex-wrap:wrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      gap:.55rem;
      padding:0.78rem 1.25rem;
      border-radius:999px;
      font-size:0.86rem;
      font-weight:800;
      letter-spacing:0.18em;
      text-transform:uppercase;
      border:1px solid transparent;
      cursor:pointer;
    }

    .btn.primary{
      background: linear-gradient(120deg,#f59e0b,#fbbf24);
      color:#111827;
    }

    .btn.outline{
      background: rgba(15,23,42,0.55);
      border-color: rgba(251,191,36,0.7);
      color: var(--gold);
    }

    .btn.outline:hover{
      background: rgba(251,191,36,0.12);
      border-color: rgba(251,191,36,1);
    }

    .grid{
      margin-top:1.25rem;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:1rem;
    }

    @media (max-width:980px){ .grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:640px){ .grid{ grid-template-columns:minmax(0,1fr); } }

    .trackCard{
      background: rgba(15,23,42,0.9);
      border:1px solid rgba(148,163,184,0.40);
      border-radius:18px;
      padding:1rem;
      box-shadow:0 12px 28px rgba(0,0,0,0.6);
    }

    .trackName{
      font-size:0.98rem;
      font-weight:900;
      letter-spacing:0.08em;
      text-transform:uppercase;
      margin-bottom:.35rem;
    }

    .starsRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:.5rem;
      flex-wrap:wrap;
    }

    .stars{
      font-size:1rem;
      letter-spacing:.12em;
      color:var(--gold);
      white-space:nowrap;
    }

    .meta{
      font-size:0.78rem;
      color:#9ca3af;
      letter-spacing:0.10em;
      text-transform:uppercase;
    }

    .quote{
      margin-top:.65rem;
      font-size:0.9rem;
      color:#e5e7eb;
      border-left:2px solid rgba(251,191,36,0.75);
      padding-left:.75rem;
    }

    .quote small{
      display:block;
      margin-top:.35rem;
      color:#9ca3af;
      font-size:0.78rem;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .status{
      margin-top:1rem;
      font-size:0.85rem;
      color:#cbd5e1;
    }

    .footer{
      margin-top:2rem;
      padding-top:1rem;
      border-top:1px solid rgba(31,41,55,0.9);
      font-size:0.78rem;
      color:#9ca3af;
      text-align:center;
    }
  </style>
</head>

<body>
<div class="page">
<main class="shell">

<div class="top">
  <div class="brand">
    <img src="/images/aby-official-logo.png" alt="AWAKENED BY YAH logo">
    <div>
      <span class="t1">AWAKENED BY YAH</span>
      <span class="t2">Listener Ratings • Music Only</span>
    </div>
  </div>

  <div class="navpills">
    <a class="pill" href="/">Home</a>
    <a class="pill" href="/music/">Music</a>
    <a class="pill" href="/albums/">Albums</a>
    <a class="pill gold" id="rateBtnTop" href="#">⭐ Rate a Track</a>
  </div>
</div>

<section class="card">
  <p class="kicker">Real feedback • Real impact</p>
  <h1>Listener Ratings</h1>
  <p class="sub">
    This page updates automatically. Ratings are for <strong>music only</strong>.
  </p>

  <div class="ctaRow">
    <a class="btn primary" id="rateBtn" href="#">⭐ Rate a Track</a>
  </div>

  <div class="status" id="status">Loading ratings…</div>
  <div class="grid" id="tracksGrid"></div>
</section>

<footer class="footer">
  <span id="year"></span> © AWAKENED BY YAH MUSIC GROUP — All Rights Reserved.
</footer>

</main>
</div>

<script>
  // ✅ Your real Google Form link (cleaned)
  const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScKCEixkRagcsf_XVLsQAc3RdvB3gFZCcrRlLnnm-AlTMihkA/viewform";

  document.addEventListener("DOMContentLoaded", () => {
    const yearEl = document.getElementById("year");
    if (yearEl) yearEl.textContent = new Date().getFullYear();

    ["rateBtn", "rateBtnTop"].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.href = FORM_URL;
      el.target = "_blank";
      el.rel = "noopener";
    });
  });
</script>

<!-- Ratings engine -->
<script src="script.js"></script>

</body>
</html>
