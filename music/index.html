<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="canonical" href="https://awakenedbyyahmusic.com/music/" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music | Awakened By YAH</title>

  <style>
    :root{
      --bg:#020617;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --line:rgba(255,255,255,.10);
      --glow:rgba(28,57,168,.45);
      --brand:#1C39A8;
      --brand2:#2b56ff;
      --radius:22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:
        radial-gradient(1200px 700px at 10% 0%, rgba(28,57,168,.35), transparent 55%),
        radial-gradient(900px 600px at 100% 10%, rgba(43,86,255,.25), transparent 55%),
        var(--bg);
      color:var(--text);
    }
    .wrap{max-width:1180px;margin:0 auto;padding:18px}

    .musicHero{
      position:relative;
      height:520px;
      border-radius:var(--radius);
      overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
      box-shadow:0 35px 90px rgba(0,0,0,.60);
      background:
        linear-gradient(
          180deg,
          rgba(2,6,23,.20),
          rgba(2,6,23,.40),
          rgba(2,6,23,.82)
        ),
        url("/music-banner.png");
      background-size:cover;
      background-position:center;
      margin-bottom:16px;
    }
    .musicHeroBack{
      position:absolute;
      top:16px;
      left:16px;
      z-index:2;
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }
    .musicHeroBack a{
      color:var(--text);
      text-decoration:none;
      border:1px solid rgba(255,255,255,.18);
      padding:10px 12px;
      border-radius:999px;
      background:rgba(2,6,23,.45);
      backdrop-filter: blur(6px);
      display:inline-block;
      font-weight:900;
      letter-spacing:.1px;
    }
    .musicHeroBack a:hover{border-color:rgba(255,255,255,.30)}

    .grid{
      display:grid;
      grid-template-columns: 1.35fr .65fr;
      gap:16px;
    }
    @media (max-width: 920px){
      .grid{grid-template-columns:1fr}
      .musicHero{height:420px}
    }

    .playerCard{
      border:1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border-radius: var(--radius);
      overflow:hidden;
      box-shadow: 0 22px 55px rgba(0,0,0,.45);
    }
    .playerHead{
      display:flex;gap:16px;align-items:center;
      padding:16px;
      background: linear-gradient(180deg, rgba(28,57,168,.18), transparent);
      border-bottom:1px solid var(--line);
    }
    .cover{
      width:160px;height:160px;border-radius:18px;flex:0 0 auto;
      background:#111827;
      border:1px solid var(--line);
      box-shadow: 0 0 0 6px rgba(28,57,168,.12), 0 0 32px var(--glow);
      overflow:hidden;
      display:flex;align-items:center;justify-content:center;
    }
    .cover img{width:100%;height:100%;object-fit:cover;display:block}
    .meta{min-width:0}
    .artist{font-weight:900;font-size:18px;margin:0}
    .album{color:var(--muted);margin:7px 0 0 0;font-size:14px}
    .track{margin:10px 0 0 0;font-weight:900;font-size:16px}

    .controls{padding:14px 16px 16px}
    .barRow{
      display:flex;align-items:center;gap:10px;margin-bottom:10px;
      color:var(--muted);font-size:12px;
    }
    input[type="range"]{width:100%}
    .seek{
      appearance:none;height:8px;border-radius:999px;background:rgba(255,255,255,.12);
      outline:none;
    }
    .seek::-webkit-slider-thumb{
      appearance:none;width:18px;height:18px;border-radius:50%;
      background:linear-gradient(180deg, var(--brand2), var(--brand));
      box-shadow:0 0 0 6px rgba(28,57,168,.18);
      cursor:pointer;
      border:1px solid rgba(255,255,255,.18);
    }

    .playlist{
      border-top:1px solid var(--line);
      background: rgba(0,0,0,.18);
      padding:12px;
    }
    .plist{
      list-style:none;
      padding:0;
      margin:0;
      display:flex;
      flex-direction:column;
      gap:8px;
      max-height:380px;
      overflow:auto;
    }
    .item{
      padding:10px 12px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.03);
      cursor:pointer;
    }
    .item.active{
      border-color:rgba(28,57,168,.70);
      background:rgba(28,57,168,.18);
    }
  </style>
</head>

<body>
  <div class="wrap">

    <header class="musicHero">
      <div class="musicHeroBack">
        <a href="/">← Back to Home</a>
      </div>
    </header>

    <div class="grid">
      <section class="playerCard">
        <div class="playerHead">
          <div class="cover">
            <img id="playerCover"
                 src="/kingdom-biz-cover.png"
                 onerror="this.onerror=null;this.src='/abytransparent.png';" />
          </div>

          <div class="meta">
            <p class="artist" id="playerArtist">AWAKENED BY YAH</p>
            <p class="album" id="playerAlbum">Kingdom Biz</p>
            <p class="track" id="playerTrack">TRACK 01 — Select a track</p>
          </div>
        </div>

        <div class="controls">
          <div class="barRow">
            <span id="tNow">0:00</span>
            <input id="seek" class="seek" type="range" min="0" max="1000" value="0" />
            <span id="tDur">0:00</span>
          </div>
          <button id="playBtn">▶️ Play</button>
        </div>

        <div class="playlist">
          <ul id="plist" class="plist"></ul>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
