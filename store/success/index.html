<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Success | AWAKENED BY YAH</title>
  <link rel="canonical" href="https://awakenedbyyahmusic.com/store/success/" />
  <link rel="icon" type="image/png" href="/abytransparent.png">

  <style>
    :root{
      --bg:#020617;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --line:rgba(255,255,255,.12);
      --brand:#1C39A8;
      --gold:rgba(255,210,120,.95);
      --radius:22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(1100px 800px at 20% -10%, rgba(43,86,255,.22), transparent 60%),
        radial-gradient(900px 700px at 85% 10%, rgba(28,57,168,.25), transparent 60%),
        radial-gradient(1000px 700px at 50% 120%, rgba(255,210,120,.08), transparent 55%),
        linear-gradient(180deg, #020617 0%, #040b1a 50%, #020617 100%);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px 16px;
    }
    .card{
      width:min(820px, 100%);
      border:1px solid var(--line);
      background: rgba(255,255,255,.04);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 18px 60px rgba(0,0,0,.55);
    }
    .top{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:14px;
    }
    .logo{
      width:44px;height:44px;border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.03);
      display:flex;align-items:center;justify-content:center;
      overflow:hidden;
    }
    .logo img{width:100%;height:100%;object-fit:cover;display:block}
    h1{
      margin:0;
      font-size: 22px;
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .pill{
      margin-left:auto;
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,210,120,.35);
      background: rgba(255,210,120,.10);
      color: rgba(255,230,170,.95);
      font-weight:900;
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .msg{
      color:var(--muted);
      line-height:1.55;
      font-size:14px;
      margin: 6px 0 16px;
    }
    .status{
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.22);
      border-radius: 18px;
      padding: 14px;
      margin: 12px 0 18px;
    }
    .status strong{color: rgba(255,230,170,.95)}
    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:10px;
    }
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      padding: 12px 14px;
      border-radius: 14px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--text);
      font-weight: 900;
      letter-spacing:.04em;
      text-transform: uppercase;
      cursor:pointer;
      text-decoration:none;
    }
    .btn.primary{
      border-color: rgba(255,210,120,.45);
      background: linear-gradient(180deg, rgba(255,210,120,.28), rgba(255,210,120,.10));
    }
    .fine{
      margin-top:12px;
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
    }
    code{
      background: rgba(255,255,255,.06);
      padding: 2px 6px;
      border-radius: 8px;
      border:1px solid rgba(255,255,255,.10);
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="top">
      <div class="logo"><img src="/abytransparent.png" alt=""></div>
      <h1>Payment Successful</h1>
      <div class="pill">Thank you</div>
    </div>

    <p class="msg">
      Your order went through. Your cart is now being cleared automatically so you can start fresh.
    </p>

    <div class="status" id="statusBox">
      Clearing cart…
    </div>

    <div class="row">
      <a class="btn primary" href="/store/">Back to Store</a>
      <a class="btn" href="/music/">Stream</a>
    </div>

    <div class="fine">
      If you were returned here from Stripe, you may see a <code>session_id</code> in the URL — that’s normal.
      Delivery automation comes next.
    </div>
  </div>

  <script>
    // MUST match your store page cart key
    const CART_KEY = "aby_store_cart_v1";

    function clearCart() {
      try {
        localStorage.removeItem(CART_KEY);
        return true;
      } catch (e) {
        return false;
      }
    }

    const ok = clearCart();
    const statusBox = document.getElementById("statusBox");

    if (ok) {
      statusBox.innerHTML = `✅ Cart cleared. You’re all set.`;
    } else {
      statusBox.innerHTML = `⚠️ Cart could not be cleared automatically. Please return to the store and refresh.`;
    }
  </script>
</body>
</html>
